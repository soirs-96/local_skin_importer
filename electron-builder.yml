appId: com.lolskin.localimporter
productName: LOL Skin Importer
copyright: Copyright (c) 2026 soirs-96

directories:
  output: release/${version}
  buildResources: resources

# 复用 npm 装好的 Electron,不联网下载。
# 默认行为是从 GitHub 拉 electron-v<版本>-win32-x64.zip,国内网络必挂(connect ETIMEDOUT)。
# 这里的版本由 package.json 的 electron 依赖锁死,和 node_modules/electron/dist 永远一致。
electronDist: node_modules/electron/dist

files:
  - out/**/*
  - package.json

asar: true
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LOL Skin Importer
